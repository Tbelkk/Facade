<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:">
<title>Facade</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="dither" aria-hidden="true"></div>

<header class="titlebar">
  <div class="brand">Facade</div>
  <div class="crumb">Old website <span>→</span> data + API</div>
</header>

<main class="app">

  <!-- the link -->
  <section class="intake">
    <div class="intake-top">
      <div class="eyebrow"><span class="live-dot"></span><span id="phase">Ready</span></div>
      <!-- Settings: not wired up yet -->
      <button type="button" class="settings-btn gb" id="settingsBtn" title="Settings (coming soon)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Settings
      </button>
    </div>

    <h1>Give it a link. <span>Watch the agents work.</span></h1>

    <form class="source" id="runForm" autocomplete="off">
      <label class="url gb">
        <span class="sr">Website link</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <input id="url" type="text" spellcheck="false" placeholder="https://old-clinic-2005.com" required>
      </label>
      <button type="submit" class="btn primary" id="runBtn">Run agents</button>
    </form>
  </section>

  <!-- the dashboard -->
  <section class="board" aria-label="Agents">
    <div class="board-head">
      <h2>Agents</h2>
      <span id="working">0 of 6 working</span>
      <span class="clock" id="clock">00:00</span>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<script src="dashboard.js"></script>
<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
