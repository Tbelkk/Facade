[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "facade-core"
version = "0.1.0"
description = "Facade agents: ingest + Explorer (Nemotron, Playwright, NeMo Agent Toolkit plugin)"
requires-python = ">=3.10"
dependencies = ["openai>=1.40", "python-dotenv", "pillow>=9.1", "requests", "playwright>=1.49"]

[project.optional-dependencies]
nat = ["nvidia-nat[langchain]>=1.9"]
test = ["pytest"]

# NeMo Agent Toolkit discovers our components through this entry point.
[project.entry-points."nat.components"]
facade_explorer = "explore.nat_plugin"

[tool.setuptools.packages.find]
include = ["ingest*", "explore*", "extract*", "mock_sites*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
